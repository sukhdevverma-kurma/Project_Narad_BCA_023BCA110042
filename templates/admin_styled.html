<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakshak Command Center</title>
    <script src="/static/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; margin: 0; background: #f4f6f9; height: 100vh; overflow: hidden;}
        
        /* Left Panel: Chat */
        #chat-window { width: 65%; padding: 20px; background: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        
        /* Right Panel: Controls */
        #controls { width: 35%; padding: 20px; background: #fcfcfc; overflow-y: auto; }
        
        h2 { color: #004d99; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        
        #messages { list-style-type: none; padding: 0; flex: 1; overflow-y: scroll; margin-top: 10px; border: 1px solid #eee; background: #fafafa; padding: 10px; border-radius: 5px;}
        
        #messages li { padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; font-size: 14px; position: relative; }
        
        /* Message Types */
        .system { background: #e0f7fa; color: #006064; text-align: center; font-size: 12px; }
        .admin-sent { background: #d3e9ff; color: #004d99; text-align: right; margin-left: 50px; }
        
        .victim { 
            background: #fff3cd; 
            border-left: 5px solid #ffc107; 
            color: #333;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        
        /* Audio Player Styling in Chat */
        audio { vertical-align: middle; margin-top: 5px; width: 100%; max-width: 300px; }
        
        /* Controls Styling */
        .control-group { background: white; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input[type="text"], textarea { width: 95%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #reply-btn { background: #007bff; color: white; }
        #broadcast-btn { background: #28a745; color: white; }
        
        /* QR Code Area */
        .qr-section { text-align: center; border-top: 2px dashed #ccc; padding-top: 15px; margin-top: 20px; }
        .qr-section img { width: 140px; border: 4px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="chat-window">
        <h2><span style="color: #ffc107;">NARAYAN</span> Rakshak Dashboard</h2>
        <ul id="messages">
            <li class="system">Waiting for distress signals...</li>
        </ul>
    </div>

    <div id="controls">
        <div class="control-group">
            <label><strong>📢 Broadcast (Public Announcement)</strong></label>
            <textarea id="broadcast-msg" placeholder="Example: Rescue team is reaching Sector 4..."></textarea>
            <button id="broadcast-btn">BROADCAST ALERT</button>
        </div>

        <div class="control-group">
            <label><strong>💬 Reply to Victim</strong></label>
            <input id="reply-id" type="text" placeholder="Paste Victim ID here..."/>
            <textarea id="reply-msg" placeholder="Personal message..." style="height: 50px;"></textarea>
            <button id="reply-btn">SEND REPLY</button>
        </div>

        <div class="qr-section">
            <label><strong>📱 Quick Scan Access</strong></label><br>
            <small style="color: #666;">Victims can scan this to connect:</small><br><br>
            <img src="/get_qr" alt="Scan QR Code">
            <p id="ip-display" style="color: #004d99; font-weight: bold; font-size: 13px;">Network Active</p>
        </div>
    </div>

    <script>
        const socket = io({ query: { admin: 'true' } });
        const messages = document.getElementById('messages');

        function appendLog(htmlContent, className) {
            let item = document.createElement('li');
            item.className = className;
            item.innerHTML = htmlContent; // innerHTML allows <audio> tags
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

        // 1. Receive Victim Message (Text or Audio)
        socket.on('new_victim_message', function(data) {
            // Check if it's text or audio (HTML string check)
            let content = `
                <div style="font-size: 11px; color: #666; margin-bottom: 2px;">
                    From ID: <span style="font-family: monospace; background: #eee; padding: 2px;">${data.id}</span>
                    <button onclick="document.getElementById('reply-id').value = '${data.id}'" style="width: auto; padding: 2px 8px; margin-left: 10px; font-size: 10px;">Reply</button>
                </div>
                <div style="font-size: 15px;">${data.msg}</div>
            `;
            appendLog(content, 'victim');
        });

        // 2. Admin Broadcast
        document.getElementById('broadcast-btn').onclick = function() {
            let msg = document.getElementById('broadcast-msg').value.trim();
            if(msg) {
                socket.emit('admin_broadcast', { msg: msg });
                appendLog(`📢 <strong>YOU BROADCASTED:</strong> ${msg}`, 'admin-sent');
                document.getElementById('broadcast-msg').value = '';
            }
        };

        // 3. Individual Reply
        document.getElementById('reply-btn').onclick = function() {
            let id = document.getElementById('reply-id').value.trim();
            let msg = document.getElementById('reply-msg').value.trim();
            if(id && msg) {
                socket.emit('admin_reply', { id: id, msg: msg });
                appendLog(`✅ <strong>Replied to [..${id.substr(-4)}]:</strong> ${msg}`, 'admin-sent');
                document.getElementById('reply-msg').value = '';
            }
        };

        socket.on('admin_status', function(data) {
            document.getElementById('ip-display').innerText = data.data;
        });
    </script>
</body>
</html>
