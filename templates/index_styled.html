<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aapda Sahayata (Narad)</title>
    <script src="/static/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #2a2a2a; color: #f4f6f9; margin: 0; padding: 20px; }
        #container { max-width: 500px; margin: 0 auto; background: #3c3c3c; padding: 20px; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); }
        h1 { color: #ffc107; border-bottom: 2px solid #555; padding-bottom: 10px; text-align: center; }
        #messages { list-style-type: none; padding: 0; max-height: 50vh; overflow-y: scroll; margin-bottom: 15px; }
        #messages li { padding: 10px; margin-bottom: 8px; border-radius: 6px; font-size: 14px; line-height: 1.4; display: block; clear: both; }
        .user-msg { background: #007bff; color: white; text-align: right; float: right; width: 75%; margin-left: 25%; }
        .admin { background: #dc3545; color: white; border-left: 5px solid #ffc107; font-weight: bold; float: left; width: 75%; margin-right: 25%; }
        .system { background: #6c757d; color: white; text-align: center; font-style: italic; width: 100%; }
        
        /* Input Area Styling */
        .input-group { display: flex; margin-top: 10px; clear: both; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px 0 0 6px; border: none; background: #fff; color: #000; }
        #sendBtn { width: 25%; padding: 12px; border: none; border-radius: 0 6px 6px 0; background-color: #28a745; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="container">
        <h1>🆘 Aapda Sahayata (Narad)</h1>
        
        <ul id="messages">
            <li class="system">Rescue Team se connect ho raha hai...</li>
        </ul>

        <div class="input-group">
            <input id="m" type="text" autocomplete="off" placeholder="Ya likhkar bhejein..."/>
            <button id="sendBtn" type="button">Send</button>
        </div>
    </div>

    <script>
        const socket = io();
        const messages = document.getElementById('messages');
        const sendBtn = document.getElementById('sendBtn');
        const inputField = document.getElementById('m');

        function appendMessage(msg, className) {
            let item = document.createElement('li');
            item.innerHTML = msg;
            item.className = className;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

        // --- FIXED: Text Message Logic ---
        sendBtn.onclick = function(e) {
            if (e) e.preventDefault(); // Yeh line page reload hone se rokegi
            let msg = inputField.value.trim();
            if (msg) {
                // Exact data object mapping
                socket.emit('victim_message', { msg: msg });
                appendMessage('You: ' + msg, 'user-msg');
                inputField.value = '';
            }
        };

        // Input field ke andar Keyboard Enter click support
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendBtn.click();
            }
        });

        // Incoming Messages
        socket.on('message', data => appendMessage('📢 ' + data.msg, 'admin'));
        socket.on('server_message', data => appendMessage('🚨 ADMIN: ' + data.msg, 'admin'));
        
        socket.on('connect', () => {
            const systemLabel = document.querySelector('.system');
            if (systemLabel) {
                systemLabel.textContent = 'Connected to Rescue Team!';
            }
        });
    </script>
</body>
</html>
