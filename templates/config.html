<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Configuration - Project NARAD</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .config-box {
            border: 2px solid #00ffcc;
            padding: 40px;
            width: 450px;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border-radius: 8px;
        }
        h2 { text-align: center; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 10px;}
        label { display: block; margin-top: 20px; font-size: 14px; color: #aaa; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box; /* Fix padding issue */
        }
        input[type="text"]:focus { outline: none; border-color: #00ffcc; }
        
        .hint { font-size: 12px; color: #666; margin-top: 5px; }
        
        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #00ffcc;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        button:hover { background: #00cca3; box-shadow: 0 0 15px #00ffcc; }
        
        .status-log { margin-top: 20px; font-size: 12px; color: #555; border-top: 1px solid #333; padding-top: 10px;}
    </style>
</head>
<body>

    <div class="config-box">
        <h2>System Boot Config</h2>
        <p>Project Narad / Setu Base Station</p>
        
        <form action="/initialize" method="POST">
            <label for="ip">ENTER HOST IP ADDRESS:</label>
            <input type="text" id="ip" name="host_ip" placeholder="e.g. 192.168.137.1" required>
            <div class="hint">ℹ️ Run 'ipconfig' in CMD to find your Wireless LAN adapter IP.</div>

            <button type="submit">INITIALIZE SYSTEM >>></button>
        </form>

        <div class="status-log">
            > System Status: WAITING FOR INPUT...<br>
            > DNS Module: OFF<br>
            > Web Server: STANDBY
        </div>
    </div>

</body>
</html>
